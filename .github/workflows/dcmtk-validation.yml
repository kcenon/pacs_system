name: PACS Full Validation with DCMTK Docker

# Two lanes (validation/dcmtk/features.json "lanes", #1328 step 3):
# - pr, on pull requests and pushes: every case it selects must pass. It certifies no completeness;
#   declared gaps and the components features.json leaves out of it are reported as not certified.
# - full, weekly and on demand: every component, no declared gap. Only this lane certifies completeness,
#   and it stays red until the manifest is satisfied.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'full certifies completeness; pr runs what pull requests run'
        type: choice
        options: [full, pr]
        default: full
  schedule:
    # The full lane on the default branch, Saturdays 19:07 UTC.
    - cron: '7 19 * * 6'
  pull_request:
    branches: [main, develop]
    paths:
      - 'include/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'validation/**'
      - 'scripts/run_dcmtk_validation.py'
      - '.github/actions/checkout-kcenon-deps/**'
      - '.github/workflows/dcmtk-validation.yml'
  push:
    branches: [main, develop]
    paths:
      - 'include/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'validation/**'
      - 'scripts/run_dcmtk_validation.py'
      - '.github/actions/checkout-kcenon-deps/**'
      - '.github/workflows/dcmtk-validation.yml'

permissions:
  contents: read

concurrency:
  # One group per lane, so a push never cancels a full-lane run on the same ref.
  group: pacs-dcmtk-validation-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.lane == 'full') && 'full' || 'pr' }}
  cancel-in-progress: true

jobs:
  gate-tests:
    name: Validation report contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s validation/dcmtk/tests -v

  functional-validation:
    name: PACS functions against DCMTK Docker
    needs: gate-tests
    if: github.event_name != 'schedule' && inputs.lane != 'full'
    runs-on: ubuntu-24.04
    # The image build plus the uncompressed profile, which includes the
    # 60-minute component.stability_slow.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Run the pr lane over four peer profiles sequentially
        # Any selected case that fails, is missing, skipped or blocked fails this job.
        # It does not certify completeness: the full lane does.
        run: python3 scripts/run_dcmtk_validation.py --lane pr --output "$RUNNER_TEMP/pacs-validation" --jobs 2
      - name: Publish actual feature results
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/pacs-validation/summary.txt" ]; then
            cat "$RUNNER_TEMP/pacs-validation/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Validation did not produce a summary; coverage is unknown.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Preserve all failures and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pacs-dcmtk-validation
          path: ${{ runner.temp }}/pacs-validation
          if-no-files-found: error
          retention-days: 14

  full-validation:
    name: PACS full validation against DCMTK Docker
    needs: gate-tests
    if: github.event_name == 'schedule' || inputs.lane == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Run the full lane over four peer profiles sequentially
        # Known product failures and missing external coverage remain failures.
        # This job must not be treated as proof of full coverage until its manifest is satisfied.
        run: python3 scripts/run_dcmtk_validation.py --lane full --output "$RUNNER_TEMP/pacs-validation" --jobs 2
      - name: Publish actual feature results
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/pacs-validation/summary.txt" ]; then
            cat "$RUNNER_TEMP/pacs-validation/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Validation did not produce a summary; coverage is unknown.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Preserve all failures and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pacs-dcmtk-validation-full
          path: ${{ runner.temp }}/pacs-validation
          if-no-files-found: error
          retention-days: 14
