# Sanitizer Tests Workflow for PACS System
# Runs AddressSanitizer, ThreadSanitizer, and UndefinedBehaviorSanitizer
#
# Based on database_system sanitizer patterns
#
# Note on Windows Support:
# Windows sanitizer support is limited compared to Linux/macOS:
# - MSVC supports AddressSanitizer (/fsanitize=address) since VS 2019 16.9
# - ThreadSanitizer is NOT supported on Windows with MSVC
# - UndefinedBehaviorSanitizer is partially supported
# For comprehensive sanitizer coverage, we run on Ubuntu with Clang.
# See: https://learn.microsoft.com/en-us/cpp/sanitizers/asan

name: Sanitizer Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Ensure only one workflow runs per branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizer-tests:
    name: ${{ matrix.sanitizer }} Sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread, undefined]
        build_type: [Debug]

    steps:
    - name: Checkout pacs_system
      uses: actions/checkout@v4
      with:
        path: pacs_system

    - name: Checkout kcenon dependencies (pinned versions)
      uses: ./pacs_system/.github/actions/checkout-kcenon-deps
      with:
        patch-werror: 'true'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang lld
        sudo apt-get install -y libsqlite3-dev libssl-dev libfmt-dev
        sudo apt-get install -y libgtest-dev libgmock-dev
        sudo apt-get install -y libjpeg-turbo8-dev

    - name: Set up compiler
      run: |
        echo "CC=clang" >> "$GITHUB_ENV"
        echo "CXX=clang++" >> "$GITHUB_ENV"

    - name: Configure CMake with ${{ matrix.sanitizer }} sanitizer
      working-directory: pacs_system
      run: |
        SANITIZER_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g"

        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_CXX_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}" \
          -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
          -DPACS_WARNINGS_AS_ERRORS=OFF \
          -DPACS_BUILD_TESTS=ON \
          -DPACS_BUILD_EXAMPLES=OFF \
          -DPACS_BUILD_STORAGE=ON

    - name: Build with ${{ matrix.sanitizer }} sanitizer
      working-directory: pacs_system
      run: cmake --build build --parallel

    - name: Run tests with ${{ matrix.sanitizer }} sanitizer
      working-directory: pacs_system/build
      shell: bash
      run: |
        # Tests quarantined for this sanitizer, one exact CTest name per line,
        # each with the issue that tracks it (they still run in the other CI jobs)
        quarantine="${GITHUB_WORKSPACE}/pacs_system/.github/sanitizers/ctest-quarantine-${{ matrix.sanitizer }}.txt"
        exclude=()
        if [ -f "$quarantine" ]; then
          names=$(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$quarantine")
          if [ -n "$names" ]; then
            echo "Quarantined tests (see $quarantine):"
            echo "$names"
            # Escape regex metacharacters and anchor the alternation so only
            # exact test names are excluded
            regex=$(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' \
                        -e 's/[][\\.*^$+?(){}|]/\\&/g' "$quarantine" | paste -sd '|' -)
            exclude=(--exclude-regex "^(${regex})\$")
          fi
        fi

        # No failure masking: a sanitizer report, a failed assertion, an
        # abort, or a timeout fails the test and therefore this step
        ctest --output-on-failure --verbose --timeout 300 "${exclude[@]}"
      env:
        # halt_on_error=1: the first sanitizer report aborts the test process
        # with a non-zero exit, so CTest marks the test failed. UBSan would
        # otherwise print the report and exit 0; TSan's exit code 66 and ASan's
        # default abort would fail anyway, but one explicit setting covers all
        # three. TSan and UBSan read third-party suppressions from tsan.supp
        # and ubsan.supp.
        TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1 history_size=4 suppressions=${{ github.workspace }}/pacs_system/.github/sanitizers/tsan.supp"
        ASAN_OPTIONS: "halt_on_error=1 detect_leaks=1 detect_stack_use_after_return=1"
        UBSAN_OPTIONS: "halt_on_error=1 print_stacktrace=1 suppressions=${{ github.workspace }}/pacs_system/.github/sanitizers/ubsan.supp"

    - name: Upload sanitizer logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: sanitizer-logs-${{ matrix.sanitizer }}
        path: |
          pacs_system/build/Testing/Temporary/LastTest.log
          pacs_system/build/**/*.log
        retention-days: 7
        if-no-files-found: ignore

  htj2k-arm64-ubsan:
    name: HTJ2K arm64 UBSan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        path: pacs_system
    - name: Checkout pinned ecosystem dependencies
      uses: ./pacs_system/.github/actions/checkout-kcenon-deps
      with:
        patch-werror: 'true'
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang libsqlite3-dev libssl-dev libfmt-dev libicu-dev \
          libgtest-dev libgmock-dev libjpeg-turbo8-dev libpng-dev libopenjp2-7-dev libcharls-dev
    - name: Configure with OpenJPH as C++14 (its default and the vcpkg port's mode)
      working-directory: pacs_system
      env:
        CC: clang
        CXX: clang++
      run: |
        cmake -S . -B build-arm-ubsan -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer" \
          -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer" \
          -DCMAKE_C_FLAGS_DEBUG="-O1 -g1" -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g1" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" \
          -DPACS_BUILD_TESTS=ON -DPACS_BUILD_EXAMPLES=OFF -DPACS_BUILD_BENCHMARKS=OFF \
          -DPACS_WITH_REST_API=OFF -DPACS_REQUIRE_CODECS=ON -DPACS_TEST_OPENJPH_INTERNALS=ON \
          -DPACS_TEST_OPENJPH_CXX_STANDARD=14 \
          -DPACS_WARNINGS_AS_ERRORS=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
    - name: Build codec tests and sanitizer controls with OpenJPH as C++14
      working-directory: pacs_system
      run: >-
        cmake --build build-arm-ubsan --parallel 2
        --target encoding_tests pacs_ubsan_shift_control pacs_ubsan_shift_control_cxx20
    - name: Require the C++14 RCT failure, tracked suppression and controls
      working-directory: pacs_system
      run: >-
        python3 scripts/check_openjph_arm_ubsan.py --openjph-standard 14
        --build-dir build-arm-ubsan --output arm-ubsan-results/openjph-cxx14
    - name: Reconfigure with OpenJPH as inherited C++20 (the FetchContent default)
      working-directory: pacs_system
      run: cmake -S . -B build-arm-ubsan -DPACS_TEST_OPENJPH_CXX_STANDARD=
    - name: Rebuild OpenJPH as C++20
      working-directory: pacs_system
      run: >-
        cmake --build build-arm-ubsan --parallel 2
        --target encoding_tests pacs_ubsan_shift_control pacs_ubsan_shift_control_cxx20
    - name: Require the unsuppressed C++20 pass and controls
      working-directory: pacs_system
      run: >-
        python3 scripts/check_openjph_arm_ubsan.py --openjph-standard 20
        --build-dir build-arm-ubsan --output arm-ubsan-results/openjph-cxx20
    - name: Upload raw ARM sanitizer evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: htj2k-arm64-ubsan-results
        path: |
          pacs_system/arm-ubsan-results/
          pacs_system/build-arm-ubsan/CMakeCache.txt
          pacs_system/build-arm-ubsan/compile_commands.json
        if-no-files-found: error

  sanitizer-summary:
    name: Sanitizer Test Summary
    needs: [sanitizer-tests, htj2k-arm64-ubsan]
    runs-on: ubuntu-24.04
    if: always()

    steps:
    - name: Generate summary
      run: |
        {
          echo "# Sanitizer Test Results"
          echo ""
          echo "## Test Matrix"
          echo ""
          echo "| Sanitizer | Description | Status |"
          echo "|-----------|-------------|--------|"
          echo "| AddressSanitizer | Detects memory errors (buffer overflow, use-after-free) | ${{ contains(needs.sanitizer-tests.result, 'success') && '✅' || '⚠️' }} |"
          echo "| ThreadSanitizer | Detects data races and deadlocks | ${{ contains(needs.sanitizer-tests.result, 'success') && '✅' || '⚠️' }} |"
          echo "| UndefinedBehaviorSanitizer | Detects undefined behavior | ${{ contains(needs.sanitizer-tests.result, 'success') && '✅' || '⚠️' }} |"
          echo "| ARM HTJ2K UBSan | OpenJPH as C++14 (tracked RCT suppression) and C++20 (no suppression), RGB, both generic widths and controls | ${{ needs.htj2k-arm64-ubsan.result }} |"
          echo ""
          echo "📊 Detailed logs available in **Artifacts** if tests failed"
        } >> "$GITHUB_STEP_SUMMARY"
