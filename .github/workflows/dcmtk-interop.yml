# DCMTK Interoperability Tests Workflow
# Automated testing pipeline for DCMTK compatibility
#
# @see Issue #455 - GitHub Actions CI/CD Integration for DCMTK Interoperability Tests
# @see Issue #449 - DCMTK Interoperability Test Automation Epic
#
# Tests bidirectional compatibility between pacs_system and DCMTK for:
# - C-ECHO (Verification)
# - C-STORE (Storage)
# - C-FIND (Query)
# - C-MOVE (Retrieve)

name: DCMTK Interoperability Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Ensure only one workflow runs per branch/PR to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  BUILD_TYPE: Release

jobs:
  # ============================================================================
  # DCMTK Interoperability Tests (C++ Integration Tests)
  # ============================================================================
  dcmtk-cpp-tests:
    name: DCMTK C++ Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
    - name: Checkout pacs_system
      uses: actions/checkout@v4
      with:
        path: pacs_system

    - name: Checkout kcenon dependencies (pinned versions)
      uses: ./pacs_system/.github/actions/checkout-kcenon-deps
      with:
        patch-werror: 'true'

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsqlite3-dev \
          libssl-dev \
          libfmt-dev \
          libjpeg-turbo8-dev \
          ninja-build \
          cmake \
          dcmtk \
          netcat-openbsd \
          lsof

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        # coreutils provides gtimeout; macOS runners have no timeout command
        brew install sqlite3 openssl@3 ninja cmake fmt jpeg-turbo dcmtk coreutils

    - name: Select timeout command
      run: |
        # GNU timeout is `timeout` on Ubuntu and `gtimeout` (coreutils) on macOS;
        # the assignment fails this step when neither exists
        TIMEOUT_CMD=$(command -v timeout || command -v gtimeout)
        echo "TIMEOUT_CMD=${TIMEOUT_CMD}" >> "$GITHUB_ENV"

    - name: Verify DCMTK installation
      run: |
        echo "=== DCMTK Version ==="
        for tool in echoscu storescu storescp findscu movescu; do
          command -v "$tool"
        done
        echoscu --version

    - name: Configure CMake
      working-directory: pacs_system
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
          -DPACS_WARNINGS_AS_ERRORS=OFF \
          -DPACS_BUILD_TESTS=ON \
          -DPACS_BUILD_EXAMPLES=ON \
          -DPACS_BUILD_STORAGE=ON

    - name: Build
      working-directory: pacs_system
      run: cmake --build build --parallel

    # Both directions use real TCP; test_server/storage_test_server use v2.
    # A failure, timeout, empty selection, or all-skipped selection fails this job.
    - name: Run DCMTK C-ECHO Tests
      working-directory: pacs_system
      timeout-minutes: 5
      run: |
        cd build
        if [ -f "./bin/pacs_integration_e2e" ]; then
          echo "=== Running C-ECHO Interoperability Tests ==="
          "$TIMEOUT_CMD" 180 ./bin/pacs_integration_e2e \
            "[dcmtk][echo]" \
            --warn UnmatchedTestSpec \
            --reporter console \
            --reporter junit::out=dcmtk-echo-results.xml \
            2>&1
        else
          echo "Integration test binary not found"
          exit 1
        fi

    - name: Run DCMTK C-STORE Tests
      working-directory: pacs_system
      timeout-minutes: 5
      run: |
        cd build
        if [ -f "./bin/pacs_integration_e2e" ]; then
          echo "=== Running C-STORE Interoperability Tests ==="
          "$TIMEOUT_CMD" 180 ./bin/pacs_integration_e2e \
            "[dcmtk][store]" \
            --warn UnmatchedTestSpec \
            --reporter console \
            --reporter junit::out=dcmtk-store-results.xml \
            2>&1
        else
          echo "Integration test binary not found"
          exit 1
        fi

    - name: Run DCMTK C-FIND Tests
      working-directory: pacs_system
      timeout-minutes: 5
      run: |
        cd build
        if [ -f "./bin/pacs_integration_e2e" ]; then
          echo "=== Running C-FIND Interoperability Tests ==="
          "$TIMEOUT_CMD" 180 ./bin/pacs_integration_e2e \
            "[dcmtk][find]" \
            --warn UnmatchedTestSpec \
            --reporter console \
            --reporter junit::out=dcmtk-find-results.xml \
            2>&1
        else
          echo "Integration test binary not found"
          exit 1
        fi

    - name: Run DCMTK C-MOVE Tests
      working-directory: pacs_system
      timeout-minutes: 5
      run: |
        cd build
        if [ -f "./bin/pacs_integration_e2e" ]; then
          echo "=== Running C-MOVE Interoperability Tests ==="
          "$TIMEOUT_CMD" 180 ./bin/pacs_integration_e2e \
            "[dcmtk][move]" \
            --warn UnmatchedTestSpec \
            --reporter console \
            --reporter junit::out=dcmtk-move-results.xml \
            2>&1
        else
          echo "Integration test binary not found"
          exit 1
        fi

    - name: Merge Test Results
      if: always()
      working-directory: pacs_system/build
      run: |
        echo '<?xml version="1.0" encoding="UTF-8"?><testsuites>' > dcmtk-interop-results.xml
        for f in dcmtk-*-results.xml; do
          if [ -f "$f" ] && [ "$f" != "dcmtk-interop-results.xml" ]; then
            grep -v '<?xml' "$f" | grep -v '</testsuites>' | grep -v '<testsuites>' >> dcmtk-interop-results.xml 2>/dev/null || true
          fi
        done
        echo '</testsuites>' >> dcmtk-interop-results.xml

    - name: Upload DCMTK Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: dcmtk-cpp-results-${{ matrix.os }}
        path: |
          pacs_system/build/dcmtk-*-results.xml
        retention-days: 30

    - name: Publish DCMTK Test Report
      uses: mikepenz/action-junit-report@v6
      if: always()
      with:
        report_paths: pacs_system/build/dcmtk-interop-results.xml
        fail_on_failure: true
        # Results are posted as annotations on this job instead of a
        # separate check run. The four C++ protocol selections must run;
        # a failed case also fails this job through fail_on_failure.
        annotate_only: true
        check_name: DCMTK C++ Tests (${{ matrix.os }})

  # ============================================================================
  # DCMTK Shell Script Tests
  # ============================================================================
  dcmtk-shell-tests:
    name: DCMTK Shell Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
    - name: Checkout pacs_system
      uses: actions/checkout@v4
      with:
        path: pacs_system

    - name: Checkout kcenon dependencies (pinned versions)
      uses: ./pacs_system/.github/actions/checkout-kcenon-deps
      with:
        patch-werror: 'true'

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsqlite3-dev \
          libssl-dev \
          libfmt-dev \
          libjpeg-turbo8-dev \
          ninja-build \
          cmake \
          dcmtk \
          netcat-openbsd \
          lsof

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install sqlite3 openssl@3 ninja cmake fmt jpeg-turbo dcmtk coreutils

    - name: Configure and Build
      working-directory: pacs_system
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
          -DPACS_WARNINGS_AS_ERRORS=OFF \
          -DPACS_BUILD_TESTS=ON \
          -DPACS_BUILD_EXAMPLES=ON \
          -DPACS_BUILD_STORAGE=ON
        cmake --build build --parallel

    - name: Make Shell Scripts Executable
      working-directory: pacs_system
      run: |
        chmod +x ./tools/integration_tests/scripts/*.sh

    - name: Check shell test helpers
      working-directory: pacs_system
      run: python3 tools/integration_tests/scripts/test_shell_helpers.py

    - name: Run DCMTK Echo Shell Test
      id: shell_echo
      working-directory: pacs_system
      timeout-minutes: 8
      shell: bash
      run: |
        bash tools/integration_tests/scripts/test_dcmtk_echo.sh build 2>&1 | tee build/dcmtk-echo-shell.log

    - name: Run DCMTK Store Shell Test
      id: shell_store
      working-directory: pacs_system
      timeout-minutes: 8
      shell: bash
      run: |
        bash tools/integration_tests/scripts/test_dcmtk_store.sh build 2>&1 | tee build/dcmtk-store-shell.log

    - name: Run DCMTK Find Shell Test
      id: shell_find
      working-directory: pacs_system
      timeout-minutes: 8
      shell: bash
      run: |
        bash tools/integration_tests/scripts/test_dcmtk_find.sh build 2>&1 | tee build/dcmtk-find-shell.log

    - name: Run DCMTK Move Shell Test
      id: shell_move
      working-directory: pacs_system
      timeout-minutes: 8
      shell: bash
      run: |
        bash tools/integration_tests/scripts/test_dcmtk_move.sh build 2>&1 | tee build/dcmtk-move-shell.log

    - name: Record shell test outcomes
      if: always()
      run: |
        echo_outcome='${{ steps.shell_echo.outcome }}'
        store_outcome='${{ steps.shell_store.outcome }}'
        find_outcome='${{ steps.shell_find.outcome }}'
        move_outcome='${{ steps.shell_move.outcome }}'
        {
          echo "### DCMTK shell tests"
          echo ""
          echo "| Test | Outcome |"
          echo "|---|---|"
          echo "| C-ECHO | ${echo_outcome} |"
          echo "| C-STORE | ${store_outcome} |"
          echo "| C-FIND | ${find_outcome} |"
          echo "| C-MOVE | ${move_outcome} |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Shell Test Logs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: dcmtk-shell-logs-${{ matrix.os }}
        path: |
          pacs_system/build/dcmtk-*-shell.log
          pacs_system/build/test-results/shell/
        retention-days: 30

  # ============================================================================
  # Test Summary
  # ============================================================================
  dcmtk-summary:
    name: DCMTK Test Summary
    needs: [dcmtk-cpp-tests, dcmtk-shell-tests]
    runs-on: ubuntu-24.04
    if: always()

    steps:
    - name: Download All Test Results
      uses: actions/download-artifact@v4
      with:
        path: test-results
        pattern: dcmtk-*
        merge-multiple: false

    - name: Create Test Summary
      run: |
        echo "## 🔬 DCMTK Interoperability Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### C++ Integration Tests" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY

        for os in ubuntu-24.04 macos-15; do
          status="⏭️ Skipped"
          if [ -d "test-results/dcmtk-cpp-results-$os" ]; then
            status="✅ Completed"
          fi
          echo "| $os | $status |" >> $GITHUB_STEP_SUMMARY
        done

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Shell Script Tests" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY

        for os in ubuntu-24.04 macos-15; do
          status="⏭️ Skipped"
          if [ -d "test-results/dcmtk-shell-logs-$os" ]; then
            status="✅ Completed"
          fi
          echo "| $os | $status |" >> $GITHUB_STEP_SUMMARY
        done

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| DICOM Operation | C++ Tests | Shell Tests |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------------|-----------|-------------|" >> $GITHUB_STEP_SUMMARY
        echo "| C-ECHO | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| C-STORE | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| C-FIND | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| C-MOVE | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 Detailed results available in the **Artifacts** section" >> $GITHUB_STEP_SUMMARY
