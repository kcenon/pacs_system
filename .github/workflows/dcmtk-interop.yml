# DCMTK Interoperability Tests Workflow
# Automated testing pipeline for DCMTK compatibility
#
# @see Issue #455 - GitHub Actions CI/CD Integration for DCMTK Interoperability Tests
# @see Issue #449 - DCMTK Interoperability Test Automation Epic
#
# Tests bidirectional compatibility between pacs_system and DCMTK for:
# - C-ECHO (Verification)
# - C-STORE (Storage)
# - C-FIND (Query)
# - C-MOVE (Retrieve)

name: DCMTK Interoperability Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Ensure only one workflow runs per branch/PR to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  BUILD_TYPE: Release

jobs:
  # ============================================================================
  # DCMTK Interoperability Tests (C++ Integration Tests)
  # ============================================================================
  dcmtk-cpp-tests:
    name: DCMTK C++ Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
    - name: Checkout pacs_system
      uses: actions/checkout@v4
      with:
        path: pacs_system

    - name: Checkout kcenon dependencies (pinned versions)
      uses: ./pacs_system/.github/actions/checkout-kcenon-deps
      with:
        patch-werror: 'true'

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsqlite3-dev \
          libssl-dev \
          libfmt-dev \
          libjpeg-turbo8-dev \
          ninja-build \
          cmake \
          dcmtk \
          netcat-openbsd \
          lsof

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        # coreutils provides gtimeout; macOS runners have no timeout command
        brew install sqlite3 openssl@3 ninja cmake fmt jpeg-turbo dcmtk coreutils

    - name: Select timeout command
      run: |
        # GNU timeout is `timeout` on Ubuntu and `gtimeout` (coreutils) on macOS;
        # the assignment fails this step when neither exists
        TIMEOUT_CMD=$(command -v timeout || command -v gtimeout)
        echo "TIMEOUT_CMD=${TIMEOUT_CMD}" >> "$GITHUB_ENV"

    - name: Verify DCMTK installation
      run: |
        echo "=== DCMTK Version ==="
        echoscu --version || echo "echoscu not found"
        which echoscu || echo "echoscu path not found"
        which storescp || echo "storescp path not found"
        which findscu || echo "findscu path not found"
        which movescu || echo "movescu path not found"

    - name: Configure CMake
      working-directory: pacs_system
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
          -DPACS_WARNINGS_AS_ERRORS=OFF \
          -DPACS_BUILD_TESTS=ON \
          -DPACS_BUILD_EXAMPLES=ON \
          -DPACS_BUILD_STORAGE=ON

    - name: Build
      working-directory: pacs_system
      run: cmake --build build --parallel

    # No failure masking in the four DCMTK test steps: a failed test, an abort,
    # or the timeout fails the step. Every case currently SKIPs because
    # pacs_system has no real TCP DICOM path yet (supports_real_tcp_dicom(),
    # #1240), and Catch2 exits with code 4 when all selected cases skip, so
    # --allow-running-no-tests accepts an all-skipped run. --warn
    # UnmatchedTestSpec still fails the step when the tag filter matches no case.
    - name: Run DCMTK C-ECHO Tests
      working-directory: pacs_system
      timeout-minutes: 5
      run: |
        cd build
        if [ -f "./bin/pacs_integration_e2e" ]; then
          echo "=== Running C-ECHO Interoperability Tests ==="
          "$TIMEOUT_CMD" 180 ./bin/pacs_integration_e2e \
            "[dcmtk][echo]" \
            --allow-running-no-tests \
            --warn UnmatchedTestSpec \
            --reporter console \
            --reporter junit::out=dcmtk-echo-results.xml \
            2>&1
        else
          echo "Integration test binary not found"
          exit 1
        fi

    - name: Run DCMTK C-STORE Tests
      working-directory: pacs_system
      timeout-minutes: 5
      run: |
        cd build
        if [ -f "./bin/pacs_integration_e2e" ]; then
          echo "=== Running C-STORE Interoperability Tests ==="
          "$TIMEOUT_CMD" 180 ./bin/pacs_integration_e2e \
            "[dcmtk][store]" \
            --allow-running-no-tests \
            --warn UnmatchedTestSpec \
            --reporter console \
            --reporter junit::out=dcmtk-store-results.xml \
            2>&1
        fi

    - name: Run DCMTK C-FIND Tests
      working-directory: pacs_system
      timeout-minutes: 5
      run: |
        cd build
        if [ -f "./bin/pacs_integration_e2e" ]; then
          echo "=== Running C-FIND Interoperability Tests ==="
          "$TIMEOUT_CMD" 180 ./bin/pacs_integration_e2e \
            "[dcmtk][find]" \
            --allow-running-no-tests \
            --warn UnmatchedTestSpec \
            --reporter console \
            --reporter junit::out=dcmtk-find-results.xml \
            2>&1
        fi

    - name: Run DCMTK C-MOVE Tests
      working-directory: pacs_system
      timeout-minutes: 5
      run: |
        cd build
        if [ -f "./bin/pacs_integration_e2e" ]; then
          echo "=== Running C-MOVE Interoperability Tests ==="
          "$TIMEOUT_CMD" 180 ./bin/pacs_integration_e2e \
            "[dcmtk][move]" \
            --allow-running-no-tests \
            --warn UnmatchedTestSpec \
            --reporter console \
            --reporter junit::out=dcmtk-move-results.xml \
            2>&1
        fi

    - name: Merge Test Results
      if: always()
      working-directory: pacs_system/build
      run: |
        echo '<?xml version="1.0" encoding="UTF-8"?><testsuites>' > dcmtk-interop-results.xml
        for f in dcmtk-*-results.xml; do
          if [ -f "$f" ] && [ "$f" != "dcmtk-interop-results.xml" ]; then
            grep -v '<?xml' "$f" | grep -v '</testsuites>' | grep -v '<testsuites>' >> dcmtk-interop-results.xml 2>/dev/null || true
          fi
        done
        echo '</testsuites>' >> dcmtk-interop-results.xml

    - name: Upload DCMTK Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: dcmtk-cpp-results-${{ matrix.os }}
        path: |
          pacs_system/build/dcmtk-*-results.xml
        retention-days: 30

    - name: Publish DCMTK Test Report
      uses: mikepenz/action-junit-report@v6
      if: always()
      with:
        report_paths: pacs_system/build/dcmtk-interop-results.xml
        fail_on_failure: true
        # Results are posted as annotations on this job instead of a
        # separate check run. The cases skip until pacs_system supports
        # real TCP DICOM connections (#1240); a failed case fails this job
        # through fail_on_failure.
        annotate_only: true
        check_name: DCMTK C++ Tests (${{ matrix.os }})

  # ============================================================================
  # DCMTK Shell Script Tests
  # ============================================================================
  dcmtk-shell-tests:
    name: DCMTK Shell Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
    - name: Checkout pacs_system
      uses: actions/checkout@v4
      with:
        path: pacs_system

    - name: Checkout kcenon dependencies (pinned versions)
      uses: ./pacs_system/.github/actions/checkout-kcenon-deps
      with:
        patch-werror: 'true'

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsqlite3-dev \
          libssl-dev \
          libfmt-dev \
          libjpeg-turbo8-dev \
          ninja-build \
          cmake \
          dcmtk \
          netcat-openbsd \
          lsof

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install sqlite3 openssl@3 ninja cmake fmt jpeg-turbo dcmtk coreutils

    - name: Configure and Build
      working-directory: pacs_system
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
          -DPACS_WARNINGS_AS_ERRORS=OFF \
          -DPACS_BUILD_TESTS=ON \
          -DPACS_BUILD_EXAMPLES=ON \
          -DPACS_BUILD_STORAGE=ON
        cmake --build build --parallel

    - name: Make Shell Scripts Executable
      working-directory: pacs_system
      run: |
        chmod +x ./tools/integration_tests/scripts/*.sh

    # The four shell test steps are known failing, so each reports failure
    # without failing the job: the scripts run pacs_system SCPs and SCUs as
    # separate processes against DCMTK, which needs real TCP DICOM support
    # (#1240), and they still call echo_scu and store_scu with the old
    # positional AE-title syntax (#1258). shell: bash sets pipefail, so the
    # script's exit code survives the tee. Remove continue-on-error when both
    # are fixed.
    - name: Run DCMTK Echo Shell Test
      id: shell_echo
      working-directory: pacs_system
      timeout-minutes: 8
      continue-on-error: true
      shell: bash
      run: |
        if [ -f "./tools/integration_tests/scripts/test_dcmtk_echo.sh" ]; then
          echo "=== Running C-ECHO Shell Test ==="
          ./tools/integration_tests/scripts/test_dcmtk_echo.sh 2>&1 | tee build/dcmtk-echo-shell.log
        fi

    - name: Run DCMTK Store Shell Test
      id: shell_store
      working-directory: pacs_system
      timeout-minutes: 8
      continue-on-error: true
      shell: bash
      run: |
        if [ -f "./tools/integration_tests/scripts/test_dcmtk_store.sh" ]; then
          echo "=== Running C-STORE Shell Test ==="
          ./tools/integration_tests/scripts/test_dcmtk_store.sh 2>&1 | tee build/dcmtk-store-shell.log
        fi

    - name: Run DCMTK Find Shell Test
      id: shell_find
      working-directory: pacs_system
      timeout-minutes: 8
      continue-on-error: true
      shell: bash
      run: |
        if [ -f "./tools/integration_tests/scripts/test_dcmtk_find.sh" ]; then
          echo "=== Running C-FIND Shell Test ==="
          ./tools/integration_tests/scripts/test_dcmtk_find.sh 2>&1 | tee build/dcmtk-find-shell.log
        fi

    - name: Run DCMTK Move Shell Test
      id: shell_move
      working-directory: pacs_system
      timeout-minutes: 8
      continue-on-error: true
      shell: bash
      run: |
        if [ -f "./tools/integration_tests/scripts/test_dcmtk_move.sh" ]; then
          echo "=== Running C-MOVE Shell Test ==="
          ./tools/integration_tests/scripts/test_dcmtk_move.sh 2>&1 | tee build/dcmtk-move-shell.log
        fi

    - name: Record shell test outcomes
      if: always()
      run: |
        # continue-on-error above keeps the job green; record the real outcomes
        # so the known failures (#1240, #1258) stay visible in the job summary
        echo_outcome='${{ steps.shell_echo.outcome }}'
        store_outcome='${{ steps.shell_store.outcome }}'
        find_outcome='${{ steps.shell_find.outcome }}'
        move_outcome='${{ steps.shell_move.outcome }}'
        {
          echo "### DCMTK shell tests (known failures, quarantined under #1240 and #1258)"
          echo ""
          echo "| Test | Outcome |"
          echo "|---|---|"
          echo "| C-ECHO | ${echo_outcome} |"
          echo "| C-STORE | ${store_outcome} |"
          echo "| C-FIND | ${find_outcome} |"
          echo "| C-MOVE | ${move_outcome} |"
        } >> "$GITHUB_STEP_SUMMARY"
        for outcome in "$echo_outcome" "$store_outcome" "$find_outcome" "$move_outcome"; do
          if [ "$outcome" = failure ]; then
            echo "::warning title=Known failure (#1240 and #1258)::DCMTK shell tests failed; continue-on-error keeps this job green until #1240 and #1258 are fixed"
            break
          fi
        done

    - name: Upload Shell Test Logs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: dcmtk-shell-logs-${{ matrix.os }}
        path: |
          pacs_system/build/dcmtk-*-shell.log
        retention-days: 30

  # ============================================================================
  # Test Summary
  # ============================================================================
  dcmtk-summary:
    name: DCMTK Test Summary
    needs: [dcmtk-cpp-tests, dcmtk-shell-tests]
    runs-on: ubuntu-24.04
    if: always()

    steps:
    - name: Download All Test Results
      uses: actions/download-artifact@v4
      with:
        path: test-results
        pattern: dcmtk-*
        merge-multiple: false

    - name: Create Test Summary
      run: |
        echo "## 🔬 DCMTK Interoperability Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### C++ Integration Tests" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY

        for os in ubuntu-24.04 macos-14; do
          status="⏭️ Skipped"
          if [ -d "test-results/dcmtk-cpp-results-$os" ]; then
            status="✅ Completed"
          fi
          echo "| $os | $status |" >> $GITHUB_STEP_SUMMARY
        done

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Shell Script Tests" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY

        for os in ubuntu-24.04 macos-14; do
          status="⏭️ Skipped"
          if [ -d "test-results/dcmtk-shell-logs-$os" ]; then
            status="✅ Completed"
          fi
          echo "| $os | $status |" >> $GITHUB_STEP_SUMMARY
        done

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| DICOM Operation | C++ Tests | Shell Tests |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------------|-----------|-------------|" >> $GITHUB_STEP_SUMMARY
        echo "| C-ECHO | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| C-STORE | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| C-FIND | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| C-MOVE | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 Detailed results available in the **Artifacts** section" >> $GITHUB_STEP_SUMMARY
