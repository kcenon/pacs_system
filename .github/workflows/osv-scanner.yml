name: OSV Vulnerability Scan

on:
  push:
    branches: [ main ]
    paths:
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - '.github/workflows/osv-scanner.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
  schedule:
    # Run every Sunday at 3:17 AM UTC (the Trivy scan runs on Tuesday)
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# OSV-Scanner complements the existing dependency security scan:
#   - dependency-security-scan: filesystem scan via Trivy
#   - OSV-Scanner: dependency manifest scan using the OSV database
#
# OSV-Scanner covers vcpkg ecosystem packages, GitHub Advisory Database, and more.

jobs:
  osv-scan:
    name: OSV Scanner
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/gh-pages'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run OSV-Scanner on vcpkg manifest
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.5
        with:
          scan-args: |-
            --lockfile=vcpkg.json
            --format=sarif
            --output=osv-results.sarif
        continue-on-error: true

      - name: Run OSV-Scanner filesystem scan (fallback)
        if: hashFiles('osv-results.sarif') == ''
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.5
        with:
          scan-args: |-
            --recursive
            .
            --format=sarif
            --output=osv-results.sarif
        continue-on-error: true

      - name: Upload OSV SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('osv-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

      - name: Upload OSV results artifact
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('osv-results.sarif') != ''
        with:
          name: osv-scan-results-${{ github.sha }}
          path: osv-results.sarif
          retention-days: 30

  # Report once after all jobs, including matrices and summaries, finish.
  notify-scheduled-failure:
    name: Report scheduled failure
    needs:
      - osv-scan
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    concurrency:
      group: scheduled-failure-osv-scanner
      cancel-in-progress: false

    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v7
        env:
          WORKFLOW_FILE: osv-scanner.yml
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            if (context.eventName !== 'schedule') return;
            const results = JSON.parse(process.env.NEEDS_JSON);
            if (!Object.values(results).some(job => job.result === 'failure')) return;

            const file = process.env.WORKFLOW_FILE;
            const marker = `<!-- scheduled-ci-failure:${file} -->`;
            const endMarker = `<!-- /scheduled-ci-failure:${file} -->`;
            const title = `[Scheduled CI] ${file} failed`;
            const attempt = process.env.GITHUB_RUN_ATTEMPT;
            const repoUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}/attempts/${attempt}`;
            const report = [
              marker,
              '## Scheduled workflow failure',
              '',
              `**Workflow:** ${context.workflow} (\`.github/workflows/${file}\`)`,
              `**Schedule (UTC):** \`${context.payload.schedule}\``,
              `**Ref:** \`${context.ref}\``,
              `**Commit:** [\`${context.sha}\`](${repoUrl}/commit/${context.sha})`,
              `**Run:** [${context.runId}, attempt ${attempt}](${runUrl})`,
              '',
              '| Job | Result |',
              '| --- | --- |',
              ...Object.entries(results).map(([job, value]) => `| \`${job}\` | ${value.result} |`),
              '',
              'Skipped downstream jobs are listed separately from failures.',
              'This block is updated automatically; keep investigation notes outside it.',
              endMarker
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 100
            });
            const matches = issues.filter(issue =>
              !issue.pull_request &&
              (issue.body || '').split('\n').some(line => line.trim() === marker)
            );
            const existing = matches.find(issue => issue.state === 'open') || matches[0];

            if (!existing) {
              const { data } = await github.rest.issues.create({
                ...context.repo, title, body: report
              });
              core.info(`Scheduled failure tracked in ${data.html_url}`);
            } else {
              const start = existing.body.indexOf(marker);
              const end = existing.body.indexOf(endMarker, start + marker.length);
              if (end === -1) {
                throw new Error(`Issue #${existing.number} has an incomplete report block; preserving its body.`);
              }
              const body = existing.body.slice(0, start) + report +
                existing.body.slice(end + endMarker.length);
              if (existing.state !== 'open' || existing.title !== title || existing.body !== body) {
                await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, state: 'open', title, body
                });
              }
              core.info(`Scheduled failure tracked in ${existing.html_url}`);
            }
