name: SBOM Generation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  schedule:
    # Generate SBOM weekly on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  security-events: write

jobs:
  generate-sbom:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Generate SBOM with Syft (CycloneDX)
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: cyclonedx-json
        output-file: sbom-cyclonedx.json
        artifact-name: sbom-cyclonedx

    - name: Generate SBOM with Syft (SPDX)
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: spdx-json
        output-file: sbom-spdx.json
        artifact-name: sbom-spdx

    - name: Setup Node.js for web frontend SBOM
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate npm SBOM (CycloneDX)
      working-directory: web
      run: |
        npm ci --ignore-scripts
        npx @cyclonedx/cyclonedx-npm --output-file ../sbom-npm-cyclonedx.json --output-format JSON || true

    - name: Run npm audit
      working-directory: web
      continue-on-error: true
      run: |
        npm audit --json > ../npm-audit-report.json 2>&1 || true
        echo "## npm Audit Summary" > ../npm-audit-summary.md
        npm audit --omit=dev 2>&1 | tail -20 >> ../npm-audit-summary.md || true

    - name: Build dependency provenance summary
      run: |
        python3 << 'EOF' > dependency-provenance.md
        import json

        with open('dependency-manifest.json', 'r', encoding='utf-8') as f:
            manifest = json.load(f)

        print("# Dependency Provenance")
        print()
        print(f"Generated: workflow run")
        print()
        print("## Internal ecosystem")
        for dep in manifest.get("internal_ecosystem", []):
            print(f"- {dep['name']}: {dep['version']} ({dep['license']})")
        print()
        print("## Native and system dependencies")
        for dep in manifest.get("native_and_system", []):
            print(f"- {dep['name']}: {dep['resolution']} [{dep['license']}]")
        print()
        print("## FetchContent / vendored inputs")
        for dep in manifest.get("fetched_content", []):
            print(f"- {dep['name']}: {dep['version']} ({dep['license']})")
        print()
        print("## Frontend inputs")
        print(f"- package manifest: {manifest['web_frontend']['manifest']}")
        print(f"- lockfile: {manifest['web_frontend']['lockfile']}")
        EOF

    - name: Create combined SBOM report
      run: |
        echo "# Software Bill of Materials (SBOM)" > SBOM_REPORT.md
        echo "" >> SBOM_REPORT.md
        echo "**Repository**: ${{ github.repository }}" >> SBOM_REPORT.md
        echo "**Branch**: ${{ github.ref_name }}" >> SBOM_REPORT.md
        echo "**Commit**: ${{ github.sha }}" >> SBOM_REPORT.md
        echo "**Generated**: $(date -u)" >> SBOM_REPORT.md
        echo "" >> SBOM_REPORT.md
        echo "## Available Formats" >> SBOM_REPORT.md
        echo "" >> SBOM_REPORT.md
        echo "- **CycloneDX**: sbom-cyclonedx.json" >> SBOM_REPORT.md
        echo "- **SPDX**: sbom-spdx.json" >> SBOM_REPORT.md
        echo "" >> SBOM_REPORT.md
        cat dependency-provenance.md >> SBOM_REPORT.md

    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@v7
      with:
        name: sbom-${{ github.sha }}
        path: |
          sbom-cyclonedx.json
          sbom-spdx.json
          sbom-npm-cyclonedx.json
          npm-audit-report.json
          npm-audit-summary.md
          dependency-provenance.md
          dependency-manifest.json
          LICENSE-THIRD-PARTY
          SBOM_REPORT.md
        retention-days: 90

    - name: Upload SBOM to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          sbom-cyclonedx.json
          sbom-spdx.json
          sbom-npm-cyclonedx.json
          dependency-manifest.json
          LICENSE-THIRD-PARTY
          SBOM_REPORT.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Submit SBOM to Dependency Graph
      uses: advanced-security/spdx-dependency-submission-action@v0.1.1
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      continue-on-error: true
      with:
        filePath: sbom-spdx.json

  # Report once after all jobs, including matrices and summaries, finish.
  notify-scheduled-failure:
    name: Report scheduled failure
    needs:
      - generate-sbom
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    concurrency:
      group: scheduled-failure-sbom
      cancel-in-progress: false

    steps:
    - name: Open or update failure issue
      uses: actions/github-script@v7
      env:
        WORKFLOW_FILE: sbom.yml
        NEEDS_JSON: ${{ toJSON(needs) }}
      with:
        script: |
          if (context.eventName !== 'schedule') return;
          const results = JSON.parse(process.env.NEEDS_JSON);
          if (!Object.values(results).some(job => job.result === 'failure')) return;

          const file = process.env.WORKFLOW_FILE;
          const marker = `<!-- scheduled-ci-failure:${file} -->`;
          const endMarker = `<!-- /scheduled-ci-failure:${file} -->`;
          const title = `[Scheduled CI] ${file} failed`;
          const attempt = process.env.GITHUB_RUN_ATTEMPT;
          const repoUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}`;
          const runUrl = `${repoUrl}/actions/runs/${context.runId}/attempts/${attempt}`;
          const report = [
            marker,
            '## Scheduled workflow failure',
            '',
            `**Workflow:** ${context.workflow} (\`.github/workflows/${file}\`)`,
            `**Schedule (UTC):** \`${context.payload.schedule}\``,
            `**Ref:** \`${context.ref}\``,
            `**Commit:** [\`${context.sha}\`](${repoUrl}/commit/${context.sha})`,
            `**Run:** [${context.runId}, attempt ${attempt}](${runUrl})`,
            '',
            '| Job | Result |',
            '| --- | --- |',
            ...Object.entries(results).map(([job, value]) => `| \`${job}\` | ${value.result} |`),
            '',
            'Skipped downstream jobs are listed separately from failures.',
            'This block is updated automatically; keep investigation notes outside it.',
            endMarker
          ].join('\n');

          const issues = await github.paginate(github.rest.issues.listForRepo, {
            ...context.repo,
            state: 'all',
            sort: 'created',
            direction: 'desc',
            per_page: 100
          });
          const matches = issues.filter(issue =>
            !issue.pull_request &&
            (issue.body || '').split('\n').some(line => line.trim() === marker)
          );
          const existing = matches.find(issue => issue.state === 'open') || matches[0];

          if (!existing) {
            const { data } = await github.rest.issues.create({
              ...context.repo, title, body: report
            });
            core.info(`Scheduled failure tracked in ${data.html_url}`);
          } else {
            const start = existing.body.indexOf(marker);
            const end = existing.body.indexOf(endMarker, start + marker.length);
            if (end === -1) {
              throw new Error(`Issue #${existing.number} has an incomplete report block; preserving its body.`);
            }
            const body = existing.body.slice(0, start) + report +
              existing.body.slice(end + endMarker.length);
            if (existing.state !== 'open' || existing.title !== title || existing.body !== body) {
              await github.rest.issues.update({
                ...context.repo, issue_number: existing.number, state: 'open', title, body
              });
            }
            core.info(`Scheduled failure tracked in ${existing.html_url}`);
          }
